# Chapter 1: the bigram model.
# Train with:  uv run python -m zoey.train configs/01-bigram.toml

[run]
id = "01-bigram"
title = "The bigram model"
chapter = 1
seed = 1337

[data]
size = "small"        # TinyStories validation file (~22 MB)
tokenizer = "char"    # one token per character

[model]
name = "bigram"
block_size = 256      # characters per training window

[train]
batch_size = 64       # windows per step -> 64 x 256 = 16,384 predictions per step
max_steps = 3000
learning_rate = 0.05  # high, because this model is tiny and simple
weight_decay = 0.0
eval_iters = 20       # batches to average when measuring loss
log_interval = 10

[trace]
checkpoints = 48      # snapshots for the viewer's time-lapse
probe = "Once upon a time, there was a little girl named Lily. She loved to play outside."
prompts = ["Once upon a time", "The dog was", "Lily said, \""]
sample_tokens = 240
temperature = 1.0
